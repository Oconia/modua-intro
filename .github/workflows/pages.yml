name: Deploy Modua intro to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1 1 * *'

permissions:
  contents: read

concurrency:
  group: modua-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Modua
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the media Worker
        run: node --test
      - name: Read the published media feed
        run: curl --fail --silent --show-error --retry 3 --max-time 30 https://modua.co.kr/media-feed.json -o "$RUNNER_TEMP/modua-feed.json"
      - name: Build the public site
        run: |
          node scripts/build-share-pages.mjs
          node scripts/build-pages.mjs "$RUNNER_TEMP/modua-feed.json"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: dist/pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
